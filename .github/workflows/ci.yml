name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-cache-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'deps/sqlite/sqlite3.c') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-

      - name: Build zprobe (Debug)
        run: zig build -Doptimize=Debug

      - name: Run tests
        run: zig build test

  cross-compile:
    name: Cross-compile binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-cache-${{ runner.os }}-release-${{ hashFiles('build.zig', 'build.zig.zon', 'deps/sqlite/sqlite3.c') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-release-
            zig-cache-${{ runner.os }}-

      - name: Run cross-compilation for all release targets
        run: zig build release-all

      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          name: zprobe-binaries
          path: zig-out/bin/
          retention-days: 7
